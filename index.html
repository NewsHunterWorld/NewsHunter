<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NewsHunter - Hunting the Truth</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .logo span,
        .hero h1 span,
        footer span {
            color: #ef4444;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            cursor: pointer;
        }

        nav a:hover {
            color: #ef4444;
        }

        .hero {
            background: linear-gradient(135deg, #111827, #374151);
            color: white;
            padding: 70px 6%;
            text-align: center;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .hero p {
            font-size: 18px;
            color: #d1d5db;
        }

        .search-box {
            max-width: 700px;
            margin: 30px auto;
            display: flex;
        }

        .search-box input {
            width: 100%;
            padding: 15px;
            border: none;
            outline: none;
            border-radius: 8px 0 0 8px;
            font-size: 16px;
        }

        .search-box button {
            padding: 15px 25px;
            border: none;
            background: #ef4444;
            color: white;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
        }

        .categories {
            padding: 25px 6%;
            text-align: center;
            background: white;
        }

        .categories button {
            padding: 10px 18px;
            margin: 5px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 20px;
            cursor: pointer;
        }

        .categories button:hover {
            background: #ef4444;
            color: white;
        }

        /* LOGIN */

        #loginPanel {
            display: none;
            background: white;
            width: 88%;
            max-width: 450px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        #loginPanel h2 {
            margin-bottom: 20px;
            text-align: center;
        }

        .login-input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 16px;
            outline: none;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            background: #111827;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .login-btn:hover {
            background: #ef4444;
        }

        /* ADMIN */

        #adminPanel {
            display: none;
            background: white;
            width: 88%;
            max-width: 800px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        #adminPanel h2 {
            margin-bottom: 20px;
        }

        .logout-btn {
            float: right;
            background: #dc2626;
            color: white;
            border: none;
            padding: 9px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
            font-size: 15px;
        }

        .form-group textarea {
            height: 130px;
            resize: vertical;
        }

        .file-box {
            border: 2px dashed #ccc;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
            background: #fafafa;
        }

        .file-box input {
            border: none;
            padding: 10px;
        }

        #imagePreview {
            display: none;
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            margin-top: 15px;
            border-radius: 10px;
        }

        .publish-btn {
            background: #16a34a;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .publish-btn:hover {
            background: #15803d;
        }

        /* ADMIN NEWS */

        .admin-news {
            margin-top: 35px;
            border-top: 2px solid #eee;
            padding-top: 25px;
        }

        .admin-news h3 {
            margin-bottom: 20px;
        }

        .admin-news-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            background: #f9fafb;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .admin-news-info {
            flex: 1;
        }

        .admin-news-info strong {
            display: block;
            margin-bottom: 5px;
        }

        .admin-news-info small {
            color: #777;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 9px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        /* NEWS */

        .container {
            width: 88%;
            max-width: 1200px;
            margin: auto;
        }

        .section-title {
            margin: 30px 0 20px;
            font-size: 30px;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            padding-bottom: 50px;
        }

        .news-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: 0.3s;
        }

        .news-card:hover {
            transform: translateY(-5px);
        }

        .news-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            background: #ddd;
        }

        .news-content {
            padding: 20px;
        }

        .category {
            color: #ef4444;
            font-size: 14px;
            font-weight: bold;
        }

        .news-content h2 {
            margin: 10px 0;
            font-size: 21px;
        }

        .news-content p {
            color: #666;
            line-height: 1.6;
        }

        .date {
            margin-top: 15px;
            font-size: 13px;
            color: #888;
        }

        footer {
            background: #111827;
            color: white;
            text-align: center;
            padding: 30px;
        }

        @media(max-width: 800px) {

            header {
                flex-direction: column;
                gap: 12px;
            }

            nav a {
                margin: 0 7px;
            }

            .hero h1 {
                font-size: 36px;
            }

            .news-grid {
                grid-template-columns: 1fr;
            }

            .admin-news-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .delete-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">
            News<span>Hunter</span>
        </div>

        <nav>
            <a onclick="showHome()">Home</a>
            <a onclick="showAdminLogin()">Admin</a>
        </nav>

    </header>


    <!-- HERO -->

    <section class="hero">

        <h1>
            News<span>Hunter</span>
        </h1>

        <p>
            Hunting the Truth, Delivering the News
        </p>

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search news..."
                oninput="searchNews()"
            >

            <button onclick="searchNews()">
                Search
            </button>

        </div>

    </section>


    <!-- CATEGORIES -->

    <div class="categories">

        <button onclick="filterCategory('All')">All</button>
        <button onclick="filterCategory('National')">National</button>
        <button onclick="filterCategory('Local')">Local</button>
        <button onclick="filterCategory('World')">World</button>
        <button onclick="filterCategory('Politics')">Politics</button>
        <button onclick="filterCategory('Technology')">Technology</button>
        <button onclick="filterCategory('Science')">Science</button>
        <button onclick="filterCategory('Sports')">Sports</button>
        <button onclick="filterCategory('Business')">Business</button>
        <button onclick="filterCategory('Entertainment')">Entertainment</button>
        <button onclick="filterCategory('Health')">Health</button>
        <button onclick="filterCategory('Education')">Education</button>
        <button onclick="filterCategory('Crime')">Crime</button>
        <button onclick="filterCategory('Environment')">Environment</button>
        <button onclick="filterCategory('Lifestyle')">Lifestyle</button>
        <button onclick="filterCategory('Weather')">Weather</button>

    </div>


    <!-- ADMIN LOGIN -->

    <section id="loginPanel">

        <h2>Admin Login</h2>

        <input
            type="password"
            id="adminPassword"
            class="login-input"
            placeholder="Enter admin password"
            onkeydown="if(event.key === 'Enter') loginAdmin()"
        >

        <button
            class="login-btn"
            onclick="loginAdmin()"
        >
            Login
        </button>

    </section>


    <!-- ADMIN PANEL -->

    <section id="adminPanel">

        <button
            class="logout-btn"
            onclick="logoutAdmin()"
        >
            Logout
        </button>

        <h2>
            Admin - Publish News
        </h2>


        <div class="form-group">

            <label>
                News Title
            </label>

            <input
                type="text"
                id="newsTitle"
                placeholder="Enter news title"
            >

        </div>


        <div class="form-group">

            <label>
                Category
            </label>

            <select id="newsCategory">

                <option>National</option>
                <option>Local</option>
                <option>World</option>
                <option>Politics</option>
                <option>Technology</option>
                <option>Science</option>
                <option>Sports</option>
                <option>Business</option>
                <option>Entertainment</option>
                <option>Health</option>
                <option>Education</option>
                <option>Crime</option>
                <option>Environment</option>
                <option>Lifestyle</option>
                <option>Weather</option>

            </select>

        </div>


        <!-- IMAGE -->

        <div class="form-group">

            <label>
                Upload News Image
            </label>

            <div class="file-box">

                <input
                    type="file"
                    id="newsImageFile"
                    accept="image/*"
                    onchange="previewImage(event)"
                >

                <p>
                    Select an image from your device
                </p>

            </div>

            <img
                id="imagePreview"
                alt="Image Preview"
            >

        </div>


        <!-- DESCRIPTION -->

        <div class="form-group">

            <label>
                News Description
            </label>

            <textarea
                id="newsDescription"
                placeholder="Write the complete news..."
            ></textarea>

        </div>


        <button
            class="publish-btn"
            onclick="publishNews()"
        >
            Publish News
        </button>


        <!-- DELETE SECTION -->

        <div class="admin-news">

            <h3>
                Manage Published News
            </h3>

            <div id="adminNewsList"></div>

        </div>

    </section>


    <!-- NEWS -->

    <main class="container">

        <h2 class="section-title">
            Latest News
        </h2>

        <div
            class="news-grid"
            id="newsContainer"
        ></div>

    </main>


    <!-- FOOTER -->

    <footer>

        <p>
            © 2026
            <span>NewsHunter</span>
            |
            Hunting the Truth, Delivering the News
        </p>

    </footer>


    <script>

        // =========================
        // ADMIN PASSWORD
        // =========================

        const ADMIN_PASSWORD = "admin123";


        // =========================
        // NEWS DATA
        // =========================

        let news =
            JSON.parse(
                localStorage.getItem("newshunterNews")
            ) || [

                {
                    title: "Welcome to NewsHunter",

                    category: "National",

                    image:
                        "https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=900&q=80",

                    description:
                        "NewsHunter is a digital news platform focused on delivering local, national and international news.",

                    date:
                        new Date().toLocaleString()
                },

                {
                    title: "Technology Is Changing The World",

                    category: "Technology",

                    image:
                        "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=900&q=80",

                    description:
                        "New technologies are changing how people communicate, work and access information.",

                    date:
                        new Date().toLocaleString()
                }

            ];


        let selectedImage = "";


        // =========================
        // ADMIN LOGIN
        // =========================

        function showAdminLogin() {

            document.getElementById(
                "loginPanel"
            ).style.display = "block";

            document.getElementById(
                "adminPanel"
            ).style.display = "none";

            document.getElementById(
                "adminPassword"
            ).value = "";

            document.getElementById(
                "loginPanel"
            ).scrollIntoView({
                behavior: "smooth"
            });
        }


        function loginAdmin() {

            const password =
                document.getElementById(
                    "adminPassword"
                ).value;


            if (password === ADMIN_PASSWORD) {

                document.getElementById(
                    "loginPanel"
                ).style.display = "none";


                document.getElementById(
                    "adminPanel"
                ).style.display = "block";


                displayAdminNews();


                document.getElementById(
                    "adminPanel"
                ).scrollIntoView({
                    behavior: "smooth"
                });

            } else {

                alert(
                    "Wrong admin password!"
                );

            }
        }


        // =========================
        // LOGOUT
        // =========================

        function logoutAdmin() {

            document.getElementById(
                "adminPanel"
            ).style.display = "none";

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        // =========================
        // IMAGE PREVIEW
        // =========================

        function previewImage(event) {

            const file =
                event.target.files[0];

            const preview =
                document.getElementById(
                    "imagePreview"
                );


            if (!file) {

                selectedImage = "";

                preview.style.display =
                    "none";

                return;
            }


            if (!file.type.startsWith("image/")) {

                alert(
                    "Please select an image file."
                );

                event.target.value = "";

                return;
            }


            if (file.size > 5 * 1024 * 1024) {

                alert(
                    "Image must be smaller than 5 MB."
                );

                event.target.value = "";

                return;
            }


            const reader =
                new FileReader();


            reader.onload = function(e) {

                selectedImage =
                    e.target.result;

                preview.src =
                    selectedImage;

                preview.style.display =
                    "block";
            };


            reader.readAsDataURL(file);
        }


        // =========================
        // DISPLAY NEWS
        // =========================

        function displayNews(list = news) {

            const container =
                document.getElementById(
                    "newsContainer"
                );

            container.innerHTML = "";


            if (list.length === 0) {

                container.innerHTML =
                    "<h3>No news found.</h3>";

                return;
            }


            list.forEach(function(item) {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "news-card";


                card.innerHTML = `

                    <img
                        src="${item.image}"
                        alt="${item.title}"
                    >

                    <div class="news-content">

                        <div class="category">
                            ${item.category}
                        </div>

                        <h2>
                            ${item.title}
                        </h2>

                        <p>
                            ${item.description}
                        </p>

                        <div class="date">
                            Published:
                            ${item.date}
                        </div>

                    </div>

                `;


                container.appendChild(card);

            });
        }


        // =========================
        // DISPLAY ADMIN NEWS
        // =========================

        function displayAdminNews() {

            const list =
                document.getElementById(
                    "adminNewsList"
                );

            list.innerHTML = "";


            if (news.length === 0) {

                list.innerHTML =
                    "<p>No news available.</p>";

                return;
            }


            news.forEach(function(item, index) {

                const newsItem =
                    document.createElement(
                        "div"
                    );

                newsItem.className =
                    "admin-news-item";


                newsItem.innerHTML = `

                    <div class="admin-news-info">

                        <strong>
                            ${item.title}
                        </strong>

                        <small>
                            ${item.category}
                            |
                            ${item.date}
                        </small>

                    </div>

                    <button
                        class="delete-btn"
                        onclick="deleteNews(${index})"
                    >
                        Delete
                    </button>

                `;


                list.appendChild(newsItem);

            });
        }


        // =========================
        // DELETE NEWS
        // =========================

        function deleteNews(index) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this news?"
                );


            if (!confirmDelete) {
                return;
            }


            news.splice(index, 1);


            localStorage.setItem(
                "newshunterNews",
                JSON.stringify(news)
            );


            displayNews();

            displayAdminNews();


            alert(
                "News deleted successfully!"
            );
        }


        // =========================
        // PUBLISH NEWS
        // =========================

        function publishNews() {

            const title =
                document.getElementById(
                    "newsTitle"
                ).value.trim();


            const category =
                document.getElementById(
                    "newsCategory"
                ).value;


            const description =
                document.getElementById(
                    "newsDescription"
                ).value.trim();


            if (
                title === "" ||
                description === ""
            ) {

                alert(
                    "Please fill title and description."
                );

                return;
            }


            if (selectedImage === "") {

                alert(
                    "Please select an image."
                );

                return;
            }


            const newNews = {

                title: title,

                category: category,

                image: selectedImage,

                description: description,

                date:
                    new Date().toLocaleString()
            };


            news.unshift(newNews);


            localStorage.setItem(
                "newshunterNews",
                JSON.stringify(news)
            );


            document.getElementById(
                "newsTitle"
            ).value = "";


            document.getElementById(
                "newsDescription"
            ).value = "";


            document.getElementById(
                "newsImageFile"
            ).value = "";


            selectedImage = "";


            document.getElementById(
                "imagePreview"
            ).style.display = "none";


            displayNews();

            displayAdminNews();


            alert(
                "News published successfully!"
            );
        }


        // =========================
        // SEARCH
        // =========================

        function searchNews() {

            const search =
                document.getElementById(
                    "searchInput"
                ).value
                .toLowerCase()
                .trim();


            const result =
                news.filter(function(item) {

                    return (

                        item.title
                            .toLowerCase()
                            .includes(search)

                        ||

                        item.description
                            .toLowerCase()
                            .includes(search)

                        ||

                        item.category
                            .toLowerCase()
                            .includes(search)

                    );

                });


            displayNews(result);
        }


        // =========================
        // CATEGORY FILTER
        // =========================

        function filterCategory(category) {

            if (category === "All") {

                displayNews();

                return;
            }


            const result =
                news.filter(function(item) {

                    return (
                        item.category === category
                    );

                });


            displayNews(result);
        }


        // =========================
        // HOME
        // =========================

        function showHome() {

            document.getElementById(
                "loginPanel"
            ).style.display = "none";


            document.getElementById(
                "adminPanel"
            ).style.display = "none";


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }


        // =========================
        // START
        // =========================

        displayNews();

    </script>

</body>

</html>
