
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NewsHunter - Hunting the Truth</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #222;
        }

        /* HEADER */
        header {
            background: #111827;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .logo span {
            color: #ef4444;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            cursor: pointer;
        }

        nav a:hover {
            color: #ef4444;
        }

        /* HERO */
        .hero {
            background: linear-gradient(135deg, #111827, #374151);
            color: white;
            padding: 70px 6%;
            text-align: center;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .hero h1 span {
            color: #ef4444;
        }

        .hero p {
            font-size: 18px;
            color: #d1d5db;
        }

        /* SEARCH */
        .search-box {
            max-width: 700px;
            margin: 30px auto;
            display: flex;
        }

        .search-box input {
            width: 100%;
            padding: 15px;
            border: none;
            outline: none;
            border-radius: 8px 0 0 8px;
            font-size: 16px;
        }

        .search-box button {
            padding: 15px 25px;
            border: none;
            background: #ef4444;
            color: white;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
        }

        /* CATEGORY */
        .categories {
            padding: 25px 6%;
            text-align: center;
        }

        .categories button {
            padding: 10px 18px;
            margin: 5px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 20px;
            cursor: pointer;
        }

        .categories button:hover {
            background: #ef4444;
            color: white;
        }

        /* NEWS */
        .container {
            width: 88%;
            max-width: 1200px;
            margin: auto;
        }

        .section-title {
            margin: 20px 0;
            font-size: 30px;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            padding-bottom: 50px;
        }

        .news-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: 0.3s;
        }

        .news-card:hover {
            transform: translateY(-5px);
        }

        .news-card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
        }

        .news-content {
            padding: 20px;
        }

        .category {
            color: #ef4444;
            font-size: 14px;
            font-weight: bold;
        }

        .news-content h2 {
            margin: 10px 0;
            font-size: 21px;
        }

        .news-content p {
            color: #666;
            line-height: 1.6;
        }

        .date {
            margin-top: 15px;
            font-size: 13px;
            color: #888;
        }

        /* ADMIN */
        #adminPanel {
            display: none;
            background: white;
            width: 88%;
            max-width: 800px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        #adminPanel h2 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
        }

        .form-group textarea {
            height: 130px;
            resize: vertical;
        }

        .publish-btn {
            background: #16a34a;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 12px;
        }

        /* FOOTER */
        footer {
            background: #111827;
            color: white;
            text-align: center;
            padding: 30px;
        }

        footer span {
            color: #ef4444;
        }

        /* MOBILE */
        @media (max-width: 800px) {

            header {
                flex-direction: column;
                gap: 12px;
            }

            nav a {
                margin: 0 7px;
            }

            .hero h1 {
                font-size: 36px;
            }

            .news-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<!-- HEADER -->
<header>

    <div class="logo">
        News<span>Hunter</span>
    </div>

    <nav>
        <a onclick="showHome()">Home</a>
        <a onclick="showAdmin()">Admin</a>
    </nav>

</header>


<!-- HERO -->
<section class="hero">

    <h1>
        News<span>Hunter</span>
    </h1>

    <p>
        Hunting the Truth, Delivering the News
    </p>

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search news..."
            oninput="searchNews()"
        >

        <button onclick="searchNews()">
            Search
        </button>

    </div>

</section>


<!-- CATEGORIES -->
<div class="categories">

    <button onclick="filterCategory('All')">
        All
    </button>

    <button onclick="filterCategory('National')">
        National
    </button>

    <button onclick="filterCategory('Local')">
        Local
    </button>

    <button onclick="filterCategory('Technology')">
        Technology
    </button>

    <button onclick="filterCategory('Sports')">
        Sports
    </button>

    <button onclick="filterCategory('Business')">
        Business
    </button>

</div>


<!-- ADMIN PANEL -->
<section id="adminPanel">

    <h2>Admin - Publish News</h2>

    <div class="form-group">

        <label>News Title</label>

        <input
            type="text"
            id="newsTitle"
            placeholder="Enter news title"
        >

    </div>


    <div class="form-group">

        <label>Category</label>

        <select id="newsCategory">

            <option>National</option>
            <option>Local</option>
            <option>Technology</option>
            <option>Sports</option>
            <option>Business</option>

        </select>

    </div>


    <div class="form-group">

        <label>Image URL</label>

        <input
            type="text"
            id="newsImage"
            placeholder="https://example.com/image.jpg"
        >

    </div>


    <div class="form-group">

        <label>News Description</label>

        <textarea
            id="newsDescription"
            placeholder="Write the complete news..."
        ></textarea>

    </div>


    <button
        class="publish-btn"
        onclick="publishNews()"
    >
        Publish News
    </button>

</section>


<!-- NEWS SECTION -->
<main class="container">

    <h2 class="section-title">
        Latest News
    </h2>

    <div
        class="news-grid"
        id="newsContainer"
    ></div>

</main>


<!-- FOOTER -->
<footer>

    <p>
        © 2026 <span>NewsHunter</span>
        | Hunting the Truth, Delivering the News
    </p>

</footer>


<script>

    /*
        Default news
    */

    let news = JSON.parse(
        localStorage.getItem("newshunterNews")
    ) || [

        {
            title: "Welcome to NewsHunter",
            category: "National",
            image: "https://images.unsplash.com/photo-1504711434969-e33886168f5c",
            description:
                "NewsHunter is a digital news platform focused on delivering local, national and technology news to readers.",
            date: new Date().toLocaleString()
        },

        {
            title: "Technology Is Changing The World",
            category: "Technology",
            image: "https://images.unsplash.com/photo-1518770660439-4636190af475",
            description:
                "New technologies are changing how people communicate, work and access information.",
            date: new Date().toLocaleString()
        },

        {
            title: "Latest Sports Updates",
            category: "Sports",
            image: "https://images.unsplash.com/photo-1461896836934-ffe607ba8211",
            description:
                "Get the latest sports updates, match information and important sporting events.",
            date: new Date().toLocaleString()
        }

    ];


    /*
        Display News
    */

    function displayNews(list = news) {

        const container =
            document.getElementById("newsContainer");

        container.innerHTML = "";


        if (list.length === 0) {

            container.innerHTML =
                "<h3>No news found.</h3>";

            return;
        }


        list.forEach(function(item, index) {

            const card =
                document.createElement("div");

            card.className = "news-card";


            card.innerHTML = `

                <img
                    src="${item.image}"
                    alt="News image"
                    onerror="this.src='https://via.placeholder.com/600x350?text=NewsHunter'"
                >

                <div class="news-content">

                    <div class="category">
                        ${item.category}
                    </div>

                    <h2>
                        ${item.title}
                    </h2>

                    <p>
                        ${item.description}
                    </p>

                    <div class="date">
                        Published: ${item.date}
                    </div>

                    <button
                        class="delete-btn"
                        onclick="deleteNews(${index})"
                    >
                        Delete
                    </button>

                </div>

            `;

            container.appendChild(card);

        });

    }


    /*
        Publish News
    */

    function publishNews() {

        const title =
            document.getElementById("newsTitle").value;

        const category =
            document.getElementById("newsCategory").value;

        const image =
            document.getElementById("newsImage").value;

        const description =
            document.getElementById("newsDescription").value;


        if (
            title === "" ||
            image === "" ||
            description === ""
        ) {

            alert("Please fill all fields.");

            return;
        }


        const newNews = {

            title: title,

            category: category,

            image: image,

            description: description,

            date: new Date().toLocaleString()

        };


        news.unshift(newNews);


        /*
            Save news in browser
        */

        localStorage.setItem(
            "newshunterNews",
            JSON.stringify(news)
        );


        /*
            Clear form
        */

        document.getElementById("newsTitle").value = "";

        document.getElementById("newsImage").value = "";

        document.getElementById("newsDescription").value = "";


        displayNews();


        alert("News published successfully!");

    }


    /*
        Delete News
    */

    function deleteNews(index) {

        if (
            confirm("Are you sure you want to delete this news?")
        ) {

            news.splice(index, 1);


            localStorage.setItem(
                "newshunterNews",
                JSON.stringify(news)
            );


            displayNews();

        }

    }


    /*
        Search News
    */

    function searchNews() {

        const search =
            document
                .getElementById("searchInput")
                .value
                .toLowerCase();


        const result = news.filter(function(item) {

            return (
                item.title.toLowerCase().includes(search) ||
                item.description.toLowerCase().includes(search) ||
                item.category.toLowerCase().includes(search)
            );

        });


        displayNews(result);

    }


    /*
        Category Filter
    */

    function filterCategory(category) {

        if (category === "All") {

            displayNews();

            return;

        }


        const result =
            news.filter(function(item) {

                return item.category === category;

            });


        displayNews(result);

    }


    /*
        Show Admin
    */

    function showAdmin() {

        document.getElementById("adminPanel").style.display =
            "block";


        document.getElementById("adminPanel")
            .scrollIntoView({
                behavior: "smooth"
            });

    }


    /*
        Show Home
    */

    function showHome() {

        document.getElementById("adminPanel").style.display =
            "none";


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    /*
        Start website
    */

    displayNews();

</script>

</body>
</html>
